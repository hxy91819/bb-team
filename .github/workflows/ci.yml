name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Fetch pinned formal BB runtime and SDK
        run: node scripts/fetch-supply.mjs "$RUNNER_TEMP/team-supply"
      - run: npm ci --no-fund
      - run: npm run check
      - run: npm run audit
      - name: Report upstream development toolchain advisories
        continue-on-error: true
        run: npm run audit:all
      - run: node --check scripts/check-install.mjs && node --check scripts/live-smoke.mjs
      - name: Build complete plugin archive from this commit
        run: node scripts/package-release.mjs "$RUNNER_TEMP/team-release"
      - uses: actions/upload-artifact@v4
        with:
          name: team-release-${{ github.sha }}
          path: ${{ runner.temp }}/team-release/
          if-no-files-found: error
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
